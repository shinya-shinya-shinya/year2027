<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Week Calendar 2027</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f3f3f3;color:#242424;font-family:Arial,"Noto Sans JP",sans-serif}.wrap{max-width:1280px;margin:auto;padding:48px 32px 54px}h1{text-align:center;font-size:48px;letter-spacing:2px;margin:0 0 55px;font-weight:800}.tools{display:flex;align-items:center;justify-content:space-between;margin:0 0 20px}.legend{display:flex;gap:24px;font-weight:700}.dot{width:19px;height:19px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-3px}.us{background:#339af0}.jp{background:#ff4b48}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border-radius:10px;padding:12px 12px 14px;min-height:205px}.title{text-align:center;font-size:25px;font-weight:800;margin-bottom:9px}.calendar{display:grid;grid-template-columns:40px repeat(7,1fr);gap:0;text-align:center;font-size:12px;font-weight:700}.cell{height:27px;display:flex;align-items:center;justify-content:center}.ww{color:#999;background:#f5f5f5}.ww.first{border-radius:22px 22px 0 0}.ww.last{border-radius:0 0 22px 22px}.head{font-size:11px;height:23px}.sun{color:#ff4b48}.sat{color:#1688eb}.outside{color:#666}.cell.sun,.cell.sun.outside{color:#ff4b48}.cell.sat,.cell.sat.outside{color:#1688eb}.holiday span{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}.holiday.usH span{background:#2b90e9}.holiday.jpH span{background:#ff4b48}@media(max-width:850px){.grid{grid-template-columns:1fr}.tools{gap:15px;align-items:flex-start;flex-direction:column}h1{font-size:34px}.wrap{padding:30px 18px}}
@media print{.tools{display:none}.wrap{padding:20px;max-width:none}h1{font-size:34px;margin-bottom:25px}.grid{gap:10px}.card{min-height:175px;padding:8px}.cell{height:22px}.title{font-size:20px}body{background:white}@page{size:A4 landscape;margin:7mm}}
</style></head><body><div class="wrap"><h1>Work Week Calendar2027</h1><div class="tools"><div class="legend"><span><i class="dot us"></i>U.S Holidays</span><span><i class="dot jp"></i>JAPAN Holidays</span></div></div><div class="grid" id="grid"></div></div>
<script>
const year=2027;
// Holiday dots follow standard 2027 US federal holiday observances and Japan national holidays.
const us=['2027-01-01','2027-01-18','2027-02-15','2027-05-31','2027-06-18','2027-07-05','2027-09-06','2027-10-11','2027-11-11','2027-11-25','2027-12-24','2027-12-31'];
const jp=['2027-01-01','2027-01-11','2027-02-11','2027-02-23','2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05','2027-07-19','2027-08-11','2027-09-20','2027-09-23','2027-10-11','2027-11-03','2027-11-23'];
const mons=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];const heads=['Su','Mo','Tu','We','Th','Fr','Sa'];
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// Intel calendar WW: weeks run Sunday-Saturday; WW01 contains Jan 1. Subsequent weeks start Sunday.
const firstStart=new Date(year-1,11,27);function ww(d){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-firstStart)/86400000/7)+1}
function month(m){let card=document.createElement('section');card.className='card';card.dataset.month=m;let t=document.createElement('div');t.className='title';t.textContent=String(m+1).padStart(2,'0')+' '+mons[m];card.append(t);let cal=document.createElement('div');cal.className='calendar';let h=document.createElement('div');h.className='cell head ww first';h.textContent='WW';cal.append(h);heads.forEach((x,i)=>{let e=document.createElement('div');e.className='cell head '+(i==0?'sun':i==6?'sat':'');e.textContent=x;cal.append(e)});let monthWW=[[1,4],[5,8],[9,13],[14,17],[18,21],[22,26],[27,30],[31,34],[35,39],[40,43],[44,47],[48,52]][m];let start=new Date(firstStart);start.setDate(firstStart.getDate()+(monthWW[0]-1)*7);let end=new Date(firstStart);end.setDate(firstStart.getDate()+monthWW[1]*7-1);for(let d=new Date(start),r=0;d<=end;r++){let we=document.createElement('div');we.className='cell ww';we.textContent=String(ww(d)).padStart(2,'0');cal.append(we);for(let i=0;i<7;i++,d.setDate(d.getDate()+1)){let x=new Date(d),k=key(x),e=document.createElement('div');e.className='cell '+(i==0?'sun ':i==6?'sat ':'')+(x.getMonth()!=m?'outside ':'');let s=document.createElement('span');s.textContent=x.getDate();e.append(s);if(jp.includes(k)){e.classList.add('holiday','jpH')}else if(us.includes(k)){e.classList.add('holiday','usH')}cal.append(e)}}let wws=cal.querySelectorAll('.ww');wws[wws.length-1].classList.add('last');card.append(cal);return card}
for(let m=0;m<12;m++)document.getElementById('grid').append(month(m));

</script></body></html>
